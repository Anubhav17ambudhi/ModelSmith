services:
  # Combined Web Service (FastAPI Backend + Streamlit Frontend)
  - type: web
    name: modelsmith-app
    env: python
    buildCommand: pip install -r frontend/requirements.txt && pip install -r app/requirements.txt && pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_URL
        value: http://127.0.0.1:8000

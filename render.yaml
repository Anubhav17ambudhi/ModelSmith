services:
  # Backend API Service
  - type: web
    name: modelsmith-backend
    env: python
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: modelsmith-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # Celery Worker Service
  - type: worker
    name: modelsmith-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A Model_Training.worker celery_app worker --loglevel=info
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: modelsmith-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Streamlit Service
  - type: web
    name: modelsmith-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        value: https://modelsmith-backend.onrender.com

  # Managed Redis Instance
  - type: redis
    name: modelsmith-redis
    ipAllowList: [] # Allows internal connections by default
    plan: free

services:
  # Backend API & Celery Worker (Combined Web Service)
  - type: web
    name: modelsmith-backend
    env: python
    buildCommand: pip install -r app/requirements.txt && pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: modelsmith-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # Frontend Streamlit Service
  - type: web
    name: modelsmith-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        value: https://modelsmith-backend.onrender.com

  # Managed Redis Instance
  - type: redis
    name: modelsmith-redis
    ipAllowList: [] # Allows internal connections by default
    plan: free
